<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris × Jev</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <a href="/">Tetris × Jev</a>
        <div class="controls">
          <button id="toggle" disabled>Start watching</button
          ><button id="reset" class="secondary">New game</button>
        </div>
      </header>
      <section class="machine">
        <div class="jev-side">
          <div class="piece-slot" id="hold-slot">
            <span>Hold</span>
            <canvas id="hold" width="120" height="80" aria-label="Hold: empty"></canvas>
          </div>
          <section class="jev-stats" aria-labelledby="jev-stats-title">
            <h2 id="jev-stats-title">Jev</h2>
            <dl>
              <div>
                <dt>Lines cleared</dt>
                <dd id="lines">0</dd>
              </div>
              <div>
                <dt>Pieces placed</dt>
                <dd id="pieces">0</dd>
              </div>
            </dl>
          </section>
        </div>
        <div class="piece-slot" id="next-slot">
          <span>Next</span>
          <canvas id="next" width="120" height="80" aria-label="Next piece"></canvas>
        </div>
        <div class="playfield">
          <canvas
            id="board"
            width="300"
            height="600"
            aria-label="Tetris board showing Jev playing automatically"
          ></canvas>
        </div>
        <aside>
          <section class="obstacle-panel" aria-label="Place obstacles">
            <div class="obstacle-info">
              <div class="ticket-progress-heading">
                <span>Next ticket</span><span id="ticket-progress"></span>
              </div>
              <div
                id="ticket-meter"
                role="progressbar"
                aria-label="Lines toward next ticket"
                aria-valuemin="0"
                aria-valuemax="4"
                aria-valuenow="0"
              >
                <span></span><span></span><span></span><span></span>
              </div>
              <div class="ticket-progress-heading cooldown-heading">
                <span>Use cooldown</span><span id="ticket-cooldown" role="status"></span>
              </div>
              <div
                id="cooldown-meter"
                class="cooldown-meter"
                role="progressbar"
                aria-label="Pieces toward cooldown completion"
                aria-valuemin="0"
                aria-valuemax="3"
                aria-valuenow="3"
              >
                <span></span><span></span><span></span>
              </div>
              <p id="obstacle-help" role="status"></p>
            </div>
            <div class="obstacle-actions">
              <div class="piece-slot" id="obstacle-slot">
                <span>Obstacle</span>
                <div id="obstacle-concealed" aria-label="Obstacle shape hidden">?</div>
                <canvas
                  hidden
                  id="obstacle"
                  width="120"
                  height="80"
                  aria-label="Obstacle shape to place on the board"
                ></canvas>
              </div>
              <div class="ticket-actions">
                <div class="obstacle-heading">Tickets <strong id="tickets">0</strong></div>
                <button id="use-ticket" disabled>Use ticket</button>
                <button id="discard-ticket" hidden>Discard and resume</button>
              </div>
            </div>
          </section>
        </aside>
      </section>
      <p id="status" role="status">Checking configuration…</p>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
