<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tetris × Jev</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header><a href="/">Tetris × Jev</a></header>
      <section class="machine">
        <div class="piece-slot" id="hold-slot">
          <span>Hold</span>
          <canvas id="hold" width="120" height="80" aria-label="Hold: empty"></canvas>
        </div>
        <div class="piece-slot" id="next-slot">
          <span>Next</span>
          <canvas id="next" width="120" height="80" aria-label="Next piece"></canvas>
        </div>
        <div class="playfield">
          <canvas
            id="board"
            width="300"
            height="600"
            aria-label="Tetris board showing Jev playing automatically"
            aria-describedby="obstacle-range"
          ></canvas>
        </div>
        <aside>
          <section class="obstacle-panel" aria-label="Place obstacles">
            <div class="obstacle-heading">Obstacle tickets <strong id="tickets">0</strong></div>
            <div id="obstacle-concealed" aria-label="Obstacle shape hidden">?</div>
            <canvas
              hidden
              id="obstacle"
              width="120"
              height="120"
              aria-label="Obstacle shape to place on the board"
            ></canvas>
            <button id="use-ticket" disabled>Use ticket</button>
            <button id="discard-ticket" hidden>Discard and resume</button>
            <p id="ticket-cooldown" role="status"></p>
            <p id="ticket-progress"></p>
            <p id="obstacle-range"></p>
            <p id="obstacle-help" role="status"></p>
          </section>
          <dl>
            <div>
              <dt>Lines cleared</dt>
              <dd id="lines">0</dd>
            </div>
            <div>
              <dt>Pieces placed</dt>
              <dd id="pieces">0</dd>
            </div>
            <div>
              <dt>Decision time</dt>
              <dd id="elapsed">—</dd>
            </div>
          </dl>
          <p id="status" role="status">Checking configuration…</p>
          <div class="controls">
            <button id="toggle" disabled>Start watching</button
            ><button id="reset" class="secondary">New game</button>
          </div>
        </aside>
      </section>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
